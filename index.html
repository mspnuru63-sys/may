<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maya</title><meta name="description" content="L’album photo de Maya.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#fbf6f3;--ink:#3b2f33;--mut:#8a7a7e;--rose:#e8788f;--rose2:#f3dfe3;--serif:"Cormorant Garamond",Georgia,serif;--sans:"Jost",system-ui,sans-serif}
html,body{height:100%}
body{background:radial-gradient(circle at 50% 40%,#fff,var(--bg) 60%,var(--rose2));color:var(--ink);font:300 16px/1.6 var(--sans);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;padding:24px;padding-top:max(24px,env(safe-area-inset-top));padding-bottom:max(24px,env(safe-area-inset-bottom))}
.heart{width:clamp(160px,38vw,260px);height:auto;overflow:visible;filter:drop-shadow(0 12px 26px rgba(232,120,143,.35))}
.heart path{fill:var(--rose);fill-opacity:0;stroke:var(--rose);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 3s .4s cubic-bezier(.6,.1,.3,1) forwards,fillin 1.2s 3.2s ease forwards}
.heart{animation:beat 1.4s 4.4s ease-in-out infinite;transform-origin:50% 55%}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fillin{to{fill-opacity:1}}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.1)}30%{transform:scale(1)}45%{transform:scale(1.06)}}
h1{margin-top:26px;font:italic 500 clamp(52px,13vw,110px)/1 var(--serif);color:var(--rose);letter-spacing:.05em;min-height:1em}
.sub{margin-top:10px;font:italic 500 clamp(18px,3vw,24px) var(--serif);color:#5b4a4f;min-height:1.6em}
.typing::after{content:"";display:inline-block;width:2px;height:.85em;margin-left:3px;vertical-align:-.05em;background:currentColor;animation:bl .7s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.btn{margin-top:30px;display:inline-block;padding:14px 38px;border:1px solid var(--ink);border-radius:99px;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:inherit;text-decoration:none;opacity:0;transform:translateY(10px);transition:opacity .8s,transform .8s,background .3s,color .3s}
.btn.on{opacity:1;transform:none}.btn:hover{background:var(--ink);color:#fff}
.skip{position:fixed;top:max(14px,env(safe-area-inset-top));right:18px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);text-decoration:none}
.fl{position:fixed;bottom:-30px;color:var(--rose);opacity:0;pointer-events:none;animation:up var(--d) linear forwards}
@keyframes up{10%{opacity:.5}to{transform:translateY(-110vh) rotate(var(--r));opacity:0}}
@media(prefers-reduced-motion:reduce){.heart,.heart path{animation:none}.heart path{stroke-dashoffset:0;fill-opacity:1}.btn{opacity:1;transform:none;transition:none}}
</style></head><body>
<a class="skip" href="accueil.html">Passer</a>
<svg class="heart" viewBox="0 0 100 92" aria-hidden="true"><path pathLength="1" d="M50 86 C18 63 6 44 6 29 C6 16 16 7 28 7 C38 7 46 12 50 20 C54 12 62 7 72 7 C84 7 94 16 94 29 C94 44 82 63 50 86 Z"/></svg>
<h1 id="t1" data-t="Maya"></h1>
<p class="sub" id="t2" data-t="Pour toi, petit ange"></p>
<a class="btn" id="go" href="accueil.html">Entrer dans l’album</a>
<script>
(function(){
var rm=matchMedia("(prefers-reduced-motion:reduce)").matches,go=document.getElementById("go"),left=false;
function enter(){location.replace("accueil.html")}
function type(el,sp,cb){var s=el.dataset.t,k=0;el.classList.add("typing");(function st(){el.textContent=s.slice(0,++k);if(k<s.length)setTimeout(st,sp);else{el.classList.remove("typing");cb&&cb()}})()}
function hearts(){
  for(var n=0;n<14;n++){var h=document.createElement("span");h.className="fl";h.textContent="♥";
    h.style.left=Math.random()*100+"vw";h.style.fontSize=(12+Math.random()*20)+"px";
    h.style.setProperty("--d",(5+Math.random()*5)+"s");h.style.setProperty("--r",(Math.random()*60-30)+"deg");
    h.style.animationDelay=Math.random()*3+"s";document.body.appendChild(h)}
}
if(rm){document.getElementById("t1").textContent="Maya";document.getElementById("t2").textContent="Pour toi, petit ange";return}
setTimeout(function(){type(document.getElementById("t1"),170,function(){
  setTimeout(function(){type(document.getElementById("t2"),60,function(){go.classList.add("on");hearts();setTimeout(enter,3500)})},250)})},3000);
})();
</script></body></html>
